<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRQ Dynasty Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            color: #e0e7ff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }

        .header p {
            font-size: 1rem;
            color: #94a3b8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(30, 58, 138, 0.5);
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(30, 58, 138, 0.7);
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
        }

        .card-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #93c5fd;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
        }

        .card-subtext {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid #22c55e;
        }

        .status-badge.operational {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border-color: #22c55e;
        }

        .status-badge.warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border-color: #f59e0b;
        }

        .features {
            background: rgba(30, 58, 138, 0.5);
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .features h3 {
            color: #93c5fd;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .features ul {
            list-style: none;
        }

        .features li {
            padding: 8px 0;
            color: #cbd5e1;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            align-items: center;
        }

        .features li:before {
            content: "▸";
            color: #60a5fa;
            margin-right: 10px;
            font-weight: bold;
        }

        .features li:last-child {
            border-bottom: none;
        }

        .refresh-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .refresh-btn:hover {
            background: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ HRQ Dynasty Control Center</h1>
            <p>Real-time Photonic Synthetic Civilization Metrics</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="grid">
            <div class="card">
                <div class="card-title">System Status</div>
                <div class="card-value" id="status">--</div>
                <div class="card-subtext" id="status-badge"></div>
            </div>

            <div class="card">
                <div class="card-title">Uptime</div>
                <div class="card-value" id="uptime">--</div>
                <div class="card-subtext">Operational</div>
            </div>

            <div class="card">
                <div class="card-title">Requests Processed</div>
                <div class="card-value" id="requests">--</div>
                <div class="card-subtext">Total API calls</div>
            </div>

            <div class="card">
                <div class="card-title">Karma Level</div>
                <div class="card-value" id="karma">--</div>
                <div class="card-subtext">System harmony index</div>
            </div>

            <div class="card">
                <div class="card-title">Engine Mode</div>
                <div class="card-value" id="mode">--</div>
                <div class="card-subtext" id="engine">--</div>
            </div>

            <div class="card">
                <div class="card-title">Last Update</div>
                <div class="card-value" id="updated" style="font-size: 1rem;">--</div>
                <div class="card-subtext">Real-time sync</div>
            </div>
        </div>

        <div class="features">
            <h3>🔧 Active Features</h3>
            <ul id="features-list"></ul>
            <button class="refresh-btn" onclick="fetchDashboardData()">🔄 Refresh Metrics</button>
        </div>
    </div>

    <script>
        async function fetchDashboardData() {
            const errorDiv = document.getElementById('error');
            try {
                errorDiv.style.display = 'none';

                const metricsRes = await fetch('/dashboard/metrics');
                const systemRes = await fetch('/dashboard/system');

                if (!metricsRes.ok || !systemRes.ok) {
                    throw new Error('Failed to fetch dashboard data');
                }

                const metrics = await metricsRes.json();
                const system = await systemRes.json();

                // Update metrics
                document.getElementById('status').textContent = metrics.status.toUpperCase();
                document.getElementById('uptime').textContent = metrics.uptime;
                document.getElementById('requests').textContent = metrics.requests_processed;
                document.getElementById('karma').textContent = metrics.karma_level;
                document.getElementById('mode').textContent = metrics.mode;
                document.getElementById('engine').textContent = `Engine: ${metrics.engine}`;

                const now = new Date(metrics.last_updated);
                document.getElementById('updated').textContent = now.toLocaleTimeString();

                // Status badge
                const badge = document.getElementById('status-badge');
                badge.innerHTML = `<span class="status-badge operational">${metrics.status}</span>`;

                // Features list
                const featuresList = document.getElementById('features-list');
                featuresList.innerHTML = '';
                system.features.forEach(feature => {
                    const li = document.createElement('li');
                    li.textContent = feature;
                    featuresList.appendChild(li);
                });

            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = `Error: ${error.message}`;
                console.error('Dashboard error:', error);
            }
        }

        // Load data on page load
        window.addEventListener('load', fetchDashboardData);

        // Auto-refresh every 30 seconds
        setInterval(fetchDashboardData, 30000);
    </script>
</body>
</html>
